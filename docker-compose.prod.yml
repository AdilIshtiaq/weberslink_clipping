# Production overlay: adds HTTPS in front of the app.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# See DEPLOY.md.
services:
  caddy:
    image: caddy:2-alpine
    container_name: weberslinkclip-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-clip.weberslink.org}
      - API_DOMAIN=${API_DOMAIN:-clip-api.weberslink.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
