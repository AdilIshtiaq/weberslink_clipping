services:
  frontend:
    build:
      # Repository root, so the image can include CHANGELOG.md from outside frontend/.
      context: .
      dockerfile: frontend/Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-development}
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3107}
        - NEXT_PUBLIC_SELF_HOST=${SELF_HOST:-false}
        - NEXT_PUBLIC_PRO_PRICE_MONTHLY=${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-19}
        - NEXT_PUBLIC_SCALE_PRICE_MONTHLY=${NEXT_PUBLIC_SCALE_PRICE_MONTHLY:-49}
        - NEXT_PUBLIC_PRO_PRICE_ANNUAL=${NEXT_PUBLIC_PRO_PRICE_ANNUAL:-190}
        - NEXT_PUBLIC_SCALE_PRICE_ANNUAL=${NEXT_PUBLIC_SCALE_PRICE_ANNUAL:-490}
        - NEXT_PUBLIC_PRO_PLAN_MINUTE_LIMIT=${NEXT_PUBLIC_PRO_PLAN_MINUTE_LIMIT:-600}
        - NEXT_PUBLIC_SCALE_PLAN_MINUTE_LIMIT=${NEXT_PUBLIC_SCALE_PLAN_MINUTE_LIMIT:-1500}
        - NEXT_PUBLIC_SOCIAL_PUBLISHING=${NEXT_PUBLIC_SOCIAL_PUBLISHING:-}
        - NEXT_PUBLIC_MAX_VIDEO_UPLOAD_BYTES=${MAX_VIDEO_UPLOAD_BYTES:-4000000000}
    container_name: weberslinkclip-frontend
    ports:
      # Keep the legacy port for deployments whose proxy already uses 3001.
      # .env.example selects 3107 for new self-hosted installations.
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3107"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/prisma:/app/prisma
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_SELF_HOST=${SELF_HOST:-false}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3107}
      - NEXT_PUBLIC_LANDING_ONLY_MODE=${NEXT_PUBLIC_LANDING_ONLY_MODE:-false}
      - DISABLE_SIGN_UP=${DISABLE_SIGN_UP:-false}
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://weberslinkclip:weberslinkclip_password@postgres:5432/weberslinkclip
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-weberslinkclip_dev_secret_change_in_production}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3107}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID}
      - STRIPE_SCALE_PRICE_ID=${STRIPE_SCALE_PRICE_ID}
      - STRIPE_PRO_ANNUAL_PRICE_ID=${STRIPE_PRO_ANNUAL_PRICE_ID}
      - STRIPE_SCALE_ANNUAL_PRICE_ID=${STRIPE_SCALE_ANNUAL_PRICE_ID}
      - STRIPE_PRO_LEGACY_PRICE_IDS=${STRIPE_PRO_LEGACY_PRICE_IDS:-}
      - STRIPE_SCALE_LEGACY_PRICE_IDS=${STRIPE_SCALE_LEGACY_PRICE_IDS:-}
      - NEXT_PUBLIC_PRO_PRICE_MONTHLY=${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-19}
      - NEXT_PUBLIC_SCALE_PRICE_MONTHLY=${NEXT_PUBLIC_SCALE_PRICE_MONTHLY:-49}
      - NEXT_PUBLIC_PRO_PRICE_ANNUAL=${NEXT_PUBLIC_PRO_PRICE_ANNUAL:-190}
      - NEXT_PUBLIC_SCALE_PRICE_ANNUAL=${NEXT_PUBLIC_SCALE_PRICE_ANNUAL:-490}
      - NEXT_PUBLIC_PRO_PLAN_MINUTE_LIMIT=${NEXT_PUBLIC_PRO_PLAN_MINUTE_LIMIT:-600}
      - NEXT_PUBLIC_SCALE_PLAN_MINUTE_LIMIT=${NEXT_PUBLIC_SCALE_PLAN_MINUTE_LIMIT:-1500}
      - NEXT_PUBLIC_SOCIAL_PUBLISHING=${NEXT_PUBLIC_SOCIAL_PUBLISHING:-}
      - NEXT_PUBLIC_MAX_VIDEO_UPLOAD_BYTES=${MAX_VIDEO_UPLOAD_BYTES:-4000000000}
      - STRIPE_CHECKOUT_URL=${STRIPE_CHECKOUT_URL}
      - STRIPE_CUSTOMER_PORTAL_URL=${STRIPE_CUSTOMER_PORTAL_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-WeberslinkClip <onboarding@example.com>}"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Exercise Better Auth and Prisma, not only the static landing page.
      test: ["CMD", "curl", "-f", "http://localhost:3107/api/auth/get-session"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_CPU_ONLY: ${BACKEND_CPU_ONLY:-false}
    container_name: weberslinkclip-backend
    # linux/amd64 by default, including on Apple Silicon (emulated). Set
    # BACKEND_PLATFORM=linux/arm64 with BACKEND_CPU_ONLY=true for a native
    # arm64 image. CUDA wheels are amd64-only.
    platform: "${BACKEND_PLATFORM:-linux/amd64}"
    command: [".venv/bin/uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
      - clips:/app/clips
      - ./backend/fonts:/app/fonts
      - ./backend/transitions:/app/transitions
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - WEBERSLINKCLIP_SERVICE=backend
      - DATABASE_URL=postgresql+asyncpg://weberslinkclip:weberslinkclip_password@postgres:5432/weberslinkclip
      - TEMP_DIR=/app/uploads
      - MEDIA_STORAGE=${MEDIA_STORAGE:-local}
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-}
      - MEDIA_S3_PREFIX=${MEDIA_S3_PREFIX:-media}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-eu-central-1}
      - MEDIA_S3_ENDPOINT=${MEDIA_S3_ENDPOINT:-}
      - MEDIA_S3_ACCESS_KEY_ID=${MEDIA_S3_ACCESS_KEY_ID:-}
      - MEDIA_S3_SECRET_ACCESS_KEY=${MEDIA_S3_SECRET_ACCESS_KEY:-}
      - MEDIA_S3_SESSION_TOKEN=${MEDIA_S3_SESSION_TOKEN:-}
      - MEDIA_FALLBACK_BUCKET=${MEDIA_FALLBACK_BUCKET:-}
      - MEDIA_FALLBACK_ENDPOINT=${MEDIA_FALLBACK_ENDPOINT:-}
      - MEDIA_FALLBACK_REGION=${MEDIA_FALLBACK_REGION:-auto}
      - MEDIA_FALLBACK_ACCESS_KEY_ID=${MEDIA_FALLBACK_ACCESS_KEY_ID:-}
      - MEDIA_FALLBACK_SECRET_ACCESS_KEY=${MEDIA_FALLBACK_SECRET_ACCESS_KEY:-}
      - MEDIA_FAILOVER_ENABLED=${MEDIA_FAILOVER_ENABLED:-false}
      - MEDIA_URL_TTL_SECONDS=${MEDIA_URL_TTL_SECONDS:-900}
      - MEDIA_CACHE_TTL_SECONDS=${MEDIA_CACHE_TTL_SECONDS:-86400}
      - MEDIA_ORPHAN_GRACE_SECONDS=${MEDIA_ORPHAN_GRACE_SECONDS:-86400}
      - MEDIA_UPLOAD_CONCURRENCY=${MEDIA_UPLOAD_CONCURRENCY:-3}
      - MEDIA_UPLOAD_DAILY_LIMIT=${MEDIA_UPLOAD_DAILY_LIMIT:-20}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
      - ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS=${ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS:-900}
      - ASSEMBLY_AI_REQUEST_TIMEOUT_SECONDS=${ASSEMBLY_AI_REQUEST_TIMEOUT_SECONDS:-60}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - RAPIDAPI_YOUTUBE_API_KEY=${RAPIDAPI_YOUTUBE_API_KEY:-}
      - RAPIDAPI_YOUTUBE_TIMEOUT_SECONDS=${RAPIDAPI_YOUTUBE_TIMEOUT_SECONDS:-300}
      - RAPIDAPI_YOUTUBE_HOST=${RAPIDAPI_YOUTUBE_HOST:-}
      - RAPIDAPI_YOUTUBE_RELAY_HOST=${RAPIDAPI_YOUTUBE_RELAY_HOST:-}
      - APIFY_YOUTUBE_DOWNLOADER_ACTOR=${APIFY_YOUTUBE_DOWNLOADER_ACTOR:-}
      - APIFY_YOUTUBE_PROVIDERS=${APIFY_YOUTUBE_PROVIDERS:-}
      - APIFY_STORAGE_BUCKET=${APIFY_STORAGE_BUCKET:-}
      - APIFY_STORAGE_REGION=${APIFY_STORAGE_REGION:-}
      - APIFY_STORAGE_WRITER_ACCESS_KEY_ID=${APIFY_STORAGE_WRITER_ACCESS_KEY_ID:-}
      - APIFY_STORAGE_WRITER_SECRET_ACCESS_KEY=${APIFY_STORAGE_WRITER_SECRET_ACCESS_KEY:-}
      - APIFY_STORAGE_READER_ACCESS_KEY_ID=${APIFY_STORAGE_READER_ACCESS_KEY_ID:-}
      - APIFY_STORAGE_READER_SECRET_ACCESS_KEY=${APIFY_STORAGE_READER_SECRET_ACCESS_KEY:-}
      - APIFY_STORAGE_KEY_TEMPLATE=${APIFY_STORAGE_KEY_TEMPLATE:-}
      - APIFY_YOUTUBE_FALLBACK_ACTOR=${APIFY_YOUTUBE_FALLBACK_ACTOR:-}
      - APIFY_YOUTUBE_FALLBACK_ACTORS=${APIFY_YOUTUBE_FALLBACK_ACTORS:-}
      - APIFY_DOWNLOAD_MAX_CHARGE_USD=${APIFY_DOWNLOAD_MAX_CHARGE_USD:-6}
      - APIFY_FALLBACK_MAX_CHARGE_USD=${APIFY_FALLBACK_MAX_CHARGE_USD:-6}
      - APIFY_YOUTUBE_INPUT_ADAPTER=${APIFY_YOUTUBE_INPUT_ADAPTER:-start_urls}
      - APIFY_YOUTUBE_DEFAULT_QUALITY=${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
      - APIFY_RUN_TIMEOUT_SECONDS=${APIFY_RUN_TIMEOUT_SECONDS:-3600}
      - YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
      - YOUTUBE_METADATA_PROVIDER=${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
      - YOUTUBE_PREFLIGHT_TIMEOUT_SECONDS=${YOUTUBE_PREFLIGHT_TIMEOUT_SECONDS:-30}
      - YOUTUBE_DOWNLOAD_PROVIDER=${YOUTUBE_DOWNLOAD_PROVIDER:-yt_dlp}
      - YOUTUBE_PROXY_URL=${YOUTUBE_PROXY_URL:-}
      - YOUTUBE_PROXY_TIMEOUT_SECONDS=${YOUTUBE_PROXY_TIMEOUT_SECONDS:-300}
      - YOUTUBE_PROXY_COUNTRY=${YOUTUBE_PROXY_COUNTRY:-}
      - YOUTUBE_POT_PROVIDER_URL=${YOUTUBE_POT_PROVIDER_URL:-}
      - YOUTUBE_DOWNLOAD_MAX_BYTES=${YOUTUBE_DOWNLOAD_MAX_BYTES:-2000000000}
      - YOUTUBE_SECTION_PADDING_SECONDS=${YOUTUBE_SECTION_PADDING_SECONDS:-10}
      - YOUTUBE_MAX_HEIGHT=${YOUTUBE_MAX_HEIGHT:-1080}
      - YOUTUBE_SOURCE_CACHE=${YOUTUBE_SOURCE_CACHE:-on}
      - YOUTUBE_SOURCE_CACHE_TTL_SECONDS=${YOUTUBE_SOURCE_CACHE_TTL_SECONDS:-604800}
      - APIFY_EXPENSIVE_FALLBACKS=${APIFY_EXPENSIVE_FALLBACKS:-false}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-openai/gpt-6-luna}
      - RERANK_LLM=${RERANK_LLM:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_EDIT_MODEL=${AI_EDIT_MODEL:-claude-sonnet-5-5}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-assemblyai}
      - TRANSCRIPTION_LANGUAGE=${TRANSCRIPTION_LANGUAGE:-}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-medium}
      - MAX_VIDEO_DURATION=${MAX_VIDEO_DURATION:-5400}
      - PRO_YOUTUBE_MAX_VIDEO_DURATION=${PRO_YOUTUBE_MAX_VIDEO_DURATION:-5400}
      - SCALE_YOUTUBE_MAX_VIDEO_DURATION=${SCALE_YOUTUBE_MAX_VIDEO_DURATION:-10800}
      - MAX_VIDEO_UPLOAD_BYTES=${MAX_VIDEO_UPLOAD_BYTES:-4000000000}
      - QUEUED_TASK_TIMEOUT_SECONDS=${QUEUED_TASK_TIMEOUT_SECONDS:-180}
      - DEFAULT_PROCESSING_MODE=${DEFAULT_PROCESSING_MODE:-fast}
      - MAX_CLIPS=${MAX_CLIPS:-10}
      - FAST_MODE_MAX_CLIPS=${FAST_MODE_MAX_CLIPS:-10}
      - SPEAKER_FRAMING=${SPEAKER_FRAMING:-true}
      - HOOK_FIRST_TEASER=${HOOK_FIRST_TEASER:-false}
      - ASSEMBLY_AI_SPEECH_MODEL=${ASSEMBLY_AI_SPEECH_MODEL:-}
      - FAST_MODE_TRANSCRIPT_MODEL=${FAST_MODE_TRANSCRIPT_MODEL:-universal-3-5-pro}
      - SELF_HOST=${SELF_HOST:-false}
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - AUTH_SIGNATURE_TTL_SECONDS=${AUTH_SIGNATURE_TTL_SECONDS:-300}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3107,http://weberslinkclip.localhost:3107}
      - PRO_PLAN_MINUTE_LIMIT=${PRO_PLAN_MINUTE_LIMIT:-600}
      - SCALE_PLAN_MINUTE_LIMIT=${SCALE_PLAN_MINUTE_LIMIT:-1500}
      - EARLY_BIRD_ENABLED=${EARLY_BIRD_ENABLED:-true}
      - EARLY_BIRD_MINUTE_LIMIT=${EARLY_BIRD_MINUTE_LIMIT:-300}
      - EARLY_BIRD_YOUTUBE_MAX_VIDEO_DURATION=${EARLY_BIRD_YOUTUBE_MAX_VIDEO_DURATION:-3600}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-WeberslinkClip <onboarding@example.com>}"
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3107}
      # Social publishing (OAuth apps; users connect their own accounts)
      - YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID}
      - YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_APP_AUDITED=${TIKTOK_APP_AUDITED:-false}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
      - SOCIAL_OAUTH_REDIRECT_BASE_URL=${SOCIAL_OAUTH_REDIRECT_BASE_URL}
      - SOCIAL_PUBLIC_MEDIA_BASE_URL=${SOCIAL_PUBLIC_MEDIA_BASE_URL}
      - SOCIAL_METRICS_REFRESH_HOURS=${SOCIAL_METRICS_REFRESH_HOURS:-6}
      - SOCIAL_METRICS_MAX_POST_AGE_DAYS=${SOCIAL_METRICS_MAX_POST_AGE_DAYS:-60}
      - SOCIAL_PERFORMANCE_MIN_POSTS=${SOCIAL_PERFORMANCE_MIN_POSTS:-3}
      - SOCIAL_PUBLISHING_ACCESS=${SOCIAL_PUBLISHING_ACCESS:-off}
      - SOCIAL_PUBLISHING_PROVIDERS=${SOCIAL_PUBLISHING_PROVIDERS-youtube,tiktok,instagram}
      - SOCIAL_PUBLISHING_ALLOWED_EMAILS=${SOCIAL_PUBLISHING_ALLOWED_EMAILS:-}
      - WORKFLOWS_ACCESS=${WORKFLOWS_ACCESS:-admins}
      - WORKFLOWS_ALLOWED_EMAILS=${WORKFLOWS_ALLOWED_EMAILS:-}
      - WORKFLOWS_PUBLIC=${WORKFLOWS_PUBLIC:-}
      - WORKFLOW_TOPIC_MAX_CLIPS=${WORKFLOW_TOPIC_MAX_CLIPS:-15}
      - WORKFLOW_PLAN_TIMEOUT_SECONDS=${WORKFLOW_PLAN_TIMEOUT_SECONDS:-1800}
      - WORKFLOW_FULL_CONTEXT_MAX_WORDS=${WORKFLOW_FULL_CONTEXT_MAX_WORDS:-}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_CPU_ONLY: ${BACKEND_CPU_ONLY:-false}
    container_name: weberslinkclip-worker
    # Same platform override as the backend service.
    platform: "${BACKEND_PLATFORM:-linux/amd64}"
    # Starts the video worker and, unless EMBED_CRON_WORKER=0, the cron worker.
    # `docker compose up --no-build` of backend, worker, and frontend keeps
    # scheduled jobs running without a separate service.
    command: [".venv/bin/python", "-m", "src.workers.run_workers"]
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
      - clips:/app/clips
      - ./backend/fonts:/app/fonts
      - ./backend/transitions:/app/transitions
    environment: &worker-environment
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - WEBERSLINKCLIP_SERVICE=worker
      - DATABASE_URL=postgresql+asyncpg://weberslinkclip:weberslinkclip_password@postgres:5432/weberslinkclip
      - TEMP_DIR=/app/uploads
      - MEDIA_STORAGE=${MEDIA_STORAGE:-local}
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-}
      - MEDIA_S3_PREFIX=${MEDIA_S3_PREFIX:-media}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-eu-central-1}
      - MEDIA_S3_ENDPOINT=${MEDIA_S3_ENDPOINT:-}
      - MEDIA_S3_ACCESS_KEY_ID=${MEDIA_S3_ACCESS_KEY_ID:-}
      - MEDIA_S3_SECRET_ACCESS_KEY=${MEDIA_S3_SECRET_ACCESS_KEY:-}
      - MEDIA_S3_SESSION_TOKEN=${MEDIA_S3_SESSION_TOKEN:-}
      - MEDIA_FALLBACK_BUCKET=${MEDIA_FALLBACK_BUCKET:-}
      - MEDIA_FALLBACK_ENDPOINT=${MEDIA_FALLBACK_ENDPOINT:-}
      - MEDIA_FALLBACK_REGION=${MEDIA_FALLBACK_REGION:-auto}
      - MEDIA_FALLBACK_ACCESS_KEY_ID=${MEDIA_FALLBACK_ACCESS_KEY_ID:-}
      - MEDIA_FALLBACK_SECRET_ACCESS_KEY=${MEDIA_FALLBACK_SECRET_ACCESS_KEY:-}
      - MEDIA_FAILOVER_ENABLED=${MEDIA_FAILOVER_ENABLED:-false}
      - MEDIA_URL_TTL_SECONDS=${MEDIA_URL_TTL_SECONDS:-900}
      - MEDIA_CACHE_TTL_SECONDS=${MEDIA_CACHE_TTL_SECONDS:-86400}
      - MEDIA_ORPHAN_GRACE_SECONDS=${MEDIA_ORPHAN_GRACE_SECONDS:-86400}
      - MEDIA_UPLOAD_CONCURRENCY=${MEDIA_UPLOAD_CONCURRENCY:-3}
      - MEDIA_UPLOAD_DAILY_LIMIT=${MEDIA_UPLOAD_DAILY_LIMIT:-20}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY}
      - ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS=${ASSEMBLY_AI_HTTP_TIMEOUT_SECONDS:-900}
      - ASSEMBLY_AI_REQUEST_TIMEOUT_SECONDS=${ASSEMBLY_AI_REQUEST_TIMEOUT_SECONDS:-60}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - RAPIDAPI_YOUTUBE_API_KEY=${RAPIDAPI_YOUTUBE_API_KEY:-}
      - RAPIDAPI_YOUTUBE_TIMEOUT_SECONDS=${RAPIDAPI_YOUTUBE_TIMEOUT_SECONDS:-300}
      - RAPIDAPI_YOUTUBE_HOST=${RAPIDAPI_YOUTUBE_HOST:-}
      - RAPIDAPI_YOUTUBE_RELAY_HOST=${RAPIDAPI_YOUTUBE_RELAY_HOST:-}
      - APIFY_YOUTUBE_DOWNLOADER_ACTOR=${APIFY_YOUTUBE_DOWNLOADER_ACTOR:-}
      - APIFY_YOUTUBE_PROVIDERS=${APIFY_YOUTUBE_PROVIDERS:-}
      - APIFY_STORAGE_BUCKET=${APIFY_STORAGE_BUCKET:-}
      - APIFY_STORAGE_REGION=${APIFY_STORAGE_REGION:-}
      - APIFY_STORAGE_WRITER_ACCESS_KEY_ID=${APIFY_STORAGE_WRITER_ACCESS_KEY_ID:-}
      - APIFY_STORAGE_WRITER_SECRET_ACCESS_KEY=${APIFY_STORAGE_WRITER_SECRET_ACCESS_KEY:-}
      - APIFY_STORAGE_READER_ACCESS_KEY_ID=${APIFY_STORAGE_READER_ACCESS_KEY_ID:-}
      - APIFY_STORAGE_READER_SECRET_ACCESS_KEY=${APIFY_STORAGE_READER_SECRET_ACCESS_KEY:-}
      - APIFY_STORAGE_KEY_TEMPLATE=${APIFY_STORAGE_KEY_TEMPLATE:-}
      - APIFY_YOUTUBE_FALLBACK_ACTOR=${APIFY_YOUTUBE_FALLBACK_ACTOR:-}
      - APIFY_YOUTUBE_FALLBACK_ACTORS=${APIFY_YOUTUBE_FALLBACK_ACTORS:-}
      - APIFY_DOWNLOAD_MAX_CHARGE_USD=${APIFY_DOWNLOAD_MAX_CHARGE_USD:-6}
      - APIFY_FALLBACK_MAX_CHARGE_USD=${APIFY_FALLBACK_MAX_CHARGE_USD:-6}
      - APIFY_YOUTUBE_INPUT_ADAPTER=${APIFY_YOUTUBE_INPUT_ADAPTER:-start_urls}
      - APIFY_YOUTUBE_DEFAULT_QUALITY=${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
      - APIFY_RUN_TIMEOUT_SECONDS=${APIFY_RUN_TIMEOUT_SECONDS:-3600}
      - YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY}
      - YOUTUBE_METADATA_PROVIDER=${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
      - YOUTUBE_PREFLIGHT_TIMEOUT_SECONDS=${YOUTUBE_PREFLIGHT_TIMEOUT_SECONDS:-30}
      - YOUTUBE_DOWNLOAD_PROVIDER=${YOUTUBE_DOWNLOAD_PROVIDER:-yt_dlp}
      - YOUTUBE_PROXY_URL=${YOUTUBE_PROXY_URL:-}
      - YOUTUBE_PROXY_TIMEOUT_SECONDS=${YOUTUBE_PROXY_TIMEOUT_SECONDS:-300}
      - YOUTUBE_PROXY_COUNTRY=${YOUTUBE_PROXY_COUNTRY:-}
      - YOUTUBE_POT_PROVIDER_URL=${YOUTUBE_POT_PROVIDER_URL:-}
      - YOUTUBE_DOWNLOAD_MAX_BYTES=${YOUTUBE_DOWNLOAD_MAX_BYTES:-2000000000}
      - YOUTUBE_SECTION_PADDING_SECONDS=${YOUTUBE_SECTION_PADDING_SECONDS:-10}
      - YOUTUBE_MAX_HEIGHT=${YOUTUBE_MAX_HEIGHT:-1080}
      - YOUTUBE_SOURCE_CACHE=${YOUTUBE_SOURCE_CACHE:-on}
      - YOUTUBE_SOURCE_CACHE_TTL_SECONDS=${YOUTUBE_SOURCE_CACHE_TTL_SECONDS:-604800}
      - APIFY_EXPENSIVE_FALLBACKS=${APIFY_EXPENSIVE_FALLBACKS:-false}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-openai/gpt-6-luna}
      - RERANK_LLM=${RERANK_LLM:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_EDIT_MODEL=${AI_EDIT_MODEL:-claude-sonnet-5-5}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-assemblyai}
      - TRANSCRIPTION_LANGUAGE=${TRANSCRIPTION_LANGUAGE:-}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-medium}
      - MAX_VIDEO_DURATION=${MAX_VIDEO_DURATION:-5400}
      - PRO_YOUTUBE_MAX_VIDEO_DURATION=${PRO_YOUTUBE_MAX_VIDEO_DURATION:-5400}
      - SCALE_YOUTUBE_MAX_VIDEO_DURATION=${SCALE_YOUTUBE_MAX_VIDEO_DURATION:-10800}
      - MAX_VIDEO_UPLOAD_BYTES=${MAX_VIDEO_UPLOAD_BYTES:-4000000000}
      - QUEUED_TASK_TIMEOUT_SECONDS=${QUEUED_TASK_TIMEOUT_SECONDS:-180}
      - DEFAULT_PROCESSING_MODE=${DEFAULT_PROCESSING_MODE:-fast}
      - MAX_CLIPS=${MAX_CLIPS:-10}
      - FAST_MODE_MAX_CLIPS=${FAST_MODE_MAX_CLIPS:-10}
      - SPEAKER_FRAMING=${SPEAKER_FRAMING:-true}
      - HOOK_FIRST_TEASER=${HOOK_FIRST_TEASER:-false}
      - ASSEMBLY_AI_SPEECH_MODEL=${ASSEMBLY_AI_SPEECH_MODEL:-}
      - FAST_MODE_TRANSCRIPT_MODEL=${FAST_MODE_TRANSCRIPT_MODEL:-universal-3-5-pro}
      - SELF_HOST=${SELF_HOST:-false}
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - AUTH_SIGNATURE_TTL_SECONDS=${AUTH_SIGNATURE_TTL_SECONDS:-300}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3107,http://weberslinkclip.localhost:3107}
      - PRO_PLAN_MINUTE_LIMIT=${PRO_PLAN_MINUTE_LIMIT:-600}
      - SCALE_PLAN_MINUTE_LIMIT=${SCALE_PLAN_MINUTE_LIMIT:-1500}
      - EARLY_BIRD_ENABLED=${EARLY_BIRD_ENABLED:-true}
      - EARLY_BIRD_MINUTE_LIMIT=${EARLY_BIRD_MINUTE_LIMIT:-300}
      - EARLY_BIRD_YOUTUBE_MAX_VIDEO_DURATION=${EARLY_BIRD_YOUTUBE_MAX_VIDEO_DURATION:-3600}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - "SES_FROM_EMAIL=${SES_FROM_EMAIL:-WeberslinkClip <onboarding@example.com>}"
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3107}
      # Social publishing (OAuth apps; users connect their own accounts)
      - YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID}
      - YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_APP_AUDITED=${TIKTOK_APP_AUDITED:-false}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
      - SOCIAL_OAUTH_REDIRECT_BASE_URL=${SOCIAL_OAUTH_REDIRECT_BASE_URL}
      - SOCIAL_PUBLIC_MEDIA_BASE_URL=${SOCIAL_PUBLIC_MEDIA_BASE_URL}
      - SOCIAL_METRICS_REFRESH_HOURS=${SOCIAL_METRICS_REFRESH_HOURS:-6}
      - SOCIAL_METRICS_MAX_POST_AGE_DAYS=${SOCIAL_METRICS_MAX_POST_AGE_DAYS:-60}
      - SOCIAL_PERFORMANCE_MIN_POSTS=${SOCIAL_PERFORMANCE_MIN_POSTS:-3}
      - SOCIAL_PUBLISHING_ACCESS=${SOCIAL_PUBLISHING_ACCESS:-off}
      - SOCIAL_PUBLISHING_PROVIDERS=${SOCIAL_PUBLISHING_PROVIDERS-youtube,tiktok,instagram}
      - SOCIAL_PUBLISHING_ALLOWED_EMAILS=${SOCIAL_PUBLISHING_ALLOWED_EMAILS:-}
      - WORKFLOWS_ACCESS=${WORKFLOWS_ACCESS:-admins}
      - WORKFLOWS_ALLOWED_EMAILS=${WORKFLOWS_ALLOWED_EMAILS:-}
      - WORKFLOWS_PUBLIC=${WORKFLOWS_PUBLIC:-}
      - WORKFLOW_TOPIC_MAX_CLIPS=${WORKFLOW_TOPIC_MAX_CLIPS:-15}
      - WORKFLOW_PLAN_TIMEOUT_SECONDS=${WORKFLOW_PLAN_TIMEOUT_SECONDS:-1800}
      - WORKFLOW_FULL_CONTEXT_MAX_WORDS=${WORKFLOW_FULL_CONTEXT_MAX_WORDS:-}
      - VIDEO_JOB_USER_CONCURRENCY=${VIDEO_JOB_USER_CONCURRENCY:-1}
      - VIDEO_JOB_DEFER_SECONDS=${VIDEO_JOB_DEFER_SECONDS:-20}
      - QUEUE_DELAY_ALERT_SECONDS=${QUEUE_DELAY_ALERT_SECONDS:-600}
      - QUEUE_DELAY_ALERT_INTERVAL_SECONDS=${QUEUE_DELAY_ALERT_INTERVAL_SECONDS:-900}
      - EMBED_CRON_WORKER=${EMBED_CRON_WORKER:-1}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", ".venv/bin/arq", "--check", "src.workers.tasks.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional split of the cron process. Not started by a normal `up`.
  # The worker service already runs it (EMBED_CRON_WORKER=1). To use this
  # service instead: COMPOSE_PROFILES=cron and EMBED_CRON_WORKER=0.
  # It uses the same backend image build as the worker. A deploy that only
  # loads prebuilt backend/worker/frontend images does not need this service.
  cron-worker:
    profiles: ["cron"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_CPU_ONLY: ${BACKEND_CPU_ONLY:-false}
    container_name: weberslinkclip-cron-worker
    platform: "${BACKEND_PLATFORM:-linux/amd64}"
    command: [".venv/bin/arq", "src.workers.cron_worker.CronWorkerSettings"]
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
      - clips:/app/clips
      - ./backend/fonts:/app/fonts
      - ./backend/transitions:/app/transitions
    environment: *worker-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/arq", "--check", "src.workers.cron_worker.CronWorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # AI editing: turns an editor instruction into draft changes with Claude.
  # Its own queue and container, so edits answer in seconds while the main
  # worker renders. Light: no video pipeline is imported.
  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_CPU_ONLY: ${BACKEND_CPU_ONLY:-false}
    container_name: weberslinkclip-ai-worker
    platform: "${BACKEND_PLATFORM:-linux/amd64}"
    command: [".venv/bin/arq", "src.workers.ai_worker.AIWorkerSettings"]
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
    environment: *worker-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/arq", "--check", "src.workers.ai_worker.AIWorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PO token helper for yt-dlp. Opt-in: COMPOSE_PROFILES=youtube-proxy
  # and YOUTUBE_POT_PROVIDER_URL=http://bgutil:4416. The port stays on the
  # compose network; the provider has no authentication of its own.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: weberslinkclip-bgutil
    profiles: ["youtube-proxy"]
    init: true
    expose:
      - "4416"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: weberslinkclip-redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      [
        "sh",
        "-c",
        "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec docker-entrypoint.sh redis-server --requirepass \"$${REDIS_PASSWORD}\"; fi; exec docker-entrypoint.sh redis-server",
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database for storing video metadata, user data, etc.
  postgres:
    image: postgres:15-alpine
    container_name: weberslinkclip-postgres
    environment:
      POSTGRES_DB: weberslinkclip
      POSTGRES_USER: weberslinkclip
      POSTGRES_PASSWORD: weberslinkclip_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weberslinkclip -d weberslinkclip"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
    driver: local
  clips:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  default:
    name: weberslinkclip-network
