name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: weberslinkclip
          POSTGRES_USER: weberslinkclip
          POSTGRES_PASSWORD: weberslinkclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weberslinkclip -d weberslinkclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://weberslinkclip:weberslinkclip_password@127.0.0.1:5432/weberslinkclip
      TEST_DATABASE_URL: postgresql+asyncpg://weberslinkclip:weberslinkclip_password@127.0.0.1:5432/weberslinkclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: weberslinkclip_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --all-groups
      - name: Run backend tests
        run: cd backend && .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: weberslinkclip_test_secret
      BETTER_AUTH_SECRET: weberslinkclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Lint and type-check frontend
        run: cd frontend && pnpm run lint && pnpm run typecheck
      - name: Run frontend unit tests
        run: cd frontend && pnpm run test:coverage
